name: Temporary Frisco Ordinance Probe

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/frisco-probe.yml'
      - 'tools/frisco_probe.py'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: frisco-onbase-runner-20260724
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install requests beautifulsoup4
      - name: Probe Frisco OnBase and GIS
        run: python tools/frisco_probe.py
      - name: Upload probe output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frisco-probe-output
          path: tmp/frisco-probe-output
          if-no-files-found: warn
          retention-days: 7
